# Manual only (owner's call, 2026-10-13: Actions minutes are a budget). To run automatically again, replace the on: block with:
#   on:
#     push:
#       branches: [main]
#     pull_request:

name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: vet
        run: go vet ./...

      - name: test (race + coverage)
        run: go test -race -coverprofile=cover.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: cover
          path: cover.out
          if-no-files-found: ignore
